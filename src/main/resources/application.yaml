spring:
  application:
    name: agro-tool

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agro_tool}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jobs:
    zarc:
      enabled: ${ZARC_JOB_ENABLED:true}
      cron: "${ZARC_JOB_CRON:0 0 3 * * ?}"
      batch-size: 1000
      ckan-package-url: "${ZARC_CKAN_URL:https://dados.agricultura.gov.br/api/3/action/package_show?id=tabua-de-risco-zoneamento-agricola-de-risco-climatico}"
      safras-alvo:
        - "2024/2025"
        - "2025/2026"
